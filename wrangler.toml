name = "minpaku-os-worker"
main = "apps/worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
LIFF_ID = "YOUR_LIFF_ID"                 # ← LINE Developers Console で取得
AGENT_ENDPOINT = ""                      # 任意: VPS の Claude agent サーバ URL
# ADMIN_JWT_SECRET, LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN,
# LINE_STAFF_CHANNEL_SECRET, LINE_STAFF_ACCESS_TOKEN は wrangler secret put で登録

[[d1_databases]]
binding = "DB"
database_name = "minpaku-os"
database_id = "YOUR_D1_DATABASE_ID"      # ← npx wrangler d1 create minpaku-os で発行

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"              # ← npx wrangler kv namespace create KV で発行

[triggers]
crons = [
  "0 * * * *",   # 毎時00分: iCal同期
  "0 8 * * *",   # 毎日08:00: 当日チェックアウト清掃タスク発行
  "0 23 * * *",  # 毎日23:00: 翌日チェックイン最終確認
  "0 9 * * 1",   # 毎週月曜09:00: シフト希望収集
]

[dev]
port = 8787
local_protocol = "http"
