name = "minpaku-os-worker"
main = "apps/worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
LIFF_ID = "REPLACE_WITH_YOUR_LIFF_ID"
AGENT_ENDPOINT = ""
# ADMIN_JWT_SECRET, LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN are set via wrangler secret

[[d1_databases]]
binding = "DB"
database_name = "minpaku-os"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

[triggers]
crons = [
  "0 * * * *",   # 毎時00分: iCal同期
  "0 8 * * *",   # 毎日08:00: 当日チェックアウト清掃タスク発行
  "0 23 * * *",  # 毎日23:00: 翌日チェックイン最終確認
  "0 9 * * 1",   # 毎週月曜09:00: シフト希望収集
]

[dev]
port = 8787
local_protocol = "http"
